name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Generate the GitHub release body once, from the changelog, with git-cliff (the same
  # tool and cliff.toml used for CHANGELOG.md). The build jobs download it as an artifact
  # and pass it to the release, so the release notes are the real changelog section rather
  # than the tagged commit message.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, required by git-cliff
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  macos:
    name: macOS .app
    needs: notes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-bundle
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Bundle and ad-hoc sign .app
        run: |
          cargo bundle --release --format osx
          app=$(echo target/release/bundle/osx/*.app)
          # Ad-hoc sign (cargo-bundle invalidates the linker signature); without this
          # macOS reports the app as "damaged".
          codesign --force --deep --sign - "$app"
          codesign --verify --strict "$app"
      - name: Zip .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/osx/bella-presenter.app" bella-presenter-macos-arm64.zip
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: bella-presenter-macos-arm64.zip

  linux:
    name: Linux .deb
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo install cargo-bundle
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Bundle .deb
        run: cargo bundle --release --format deb
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: target/release/bundle/deb/*.deb

  windows:
    name: Windows portable zip
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Build
        run: cargo build --release
      - name: Assemble portable zip
        shell: bash
        run: |
          mkdir -p dist/bella-presenter
          cp target/release/bella-presenter.exe dist/bella-presenter/bella-presenter.exe
          cp third_party/pdfium/bin/pdfium.dll dist/bella-presenter/
          cp README.md dist/bella-presenter/ || true
          cp img/icon-256.png dist/bella-presenter/ || true
          cd dist && 7z a ../bella-presenter-windows-x64.zip bella-presenter
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: bella-presenter-windows-x64.zip
