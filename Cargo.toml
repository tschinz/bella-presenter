[package]
name = "bella-presenter"
version = "0.6.1"
edition = "2024"
description = "Fast native dual-screen presenter for PDF slides"
authors = ["tschinz"]
license = "MIT"
repository = "https://github.com/tschinz/bella-presenter"
readme = "README.md"

[package.metadata.bundle]
name = "bella-presenter"
identifier = "ch.bellatola.bella-presenter"
# One real .icns (built with iconutil) instead of loose PNGs: cargo-bundle mislabels
# 64/256/512 px PNGs as retina slots, which scrambled the icon in Spotlight.
icon = ["bundle/bella-presenter.icns"]
# Ship the platform's PDFium dynamic library inside the bundle. Populate this folder
# with `just setup-pdfium` before bundling.
resources = ["third_party/pdfium/lib"]
category = "Productivity"
short_description = "Dual-screen PDF presenter for Typst & LaTeX slides."
long_description = """
A fast, native dual-screen PDF presenter inspired by pympress. On the presenter
screen it shows the current slide, a next-slide preview, speaker notes, and a talk
timer; on the audience screen it shows just the slide, fullscreen.
"""

# Offer the app in "Open with" for PDFs on Linux (.desktop MimeType + file argument).
[package.metadata.bundle.linux]
mime_types = ["application/pdf"]
exec_args = "%f"

# Camera usage text (without it the webcam fails silently) and PDF document type ("Open with").
[package.metadata.bundle.osx]
info_plist_exts = ["bundle/info-ext.plist"]

[dependencies]
# GPUI (and its component library) through one crates.io dependency.
gpui-kit = "=0.7.0"
# The channel that wakes the UI from capture, watcher and worker threads; already in GPUI's tree.
futures = "0.3"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8.2.0"
nokhwa = { version = "0.10.11", features = ["input-native"] }
# No "copy-dylibs": its build step fails on a fresh Windows build, and no copied library is shipped.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-27"] }

[profile.dev]
opt-level = 1          # keep debug builds snappy for PDF rendering

[profile.dev.package."*"]
opt-level = 3          # optimize deps (pdfium/image) even in dev

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
