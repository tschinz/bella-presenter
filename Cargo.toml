[package]
name = "bella-presenter"
version = "0.3.0"
edition = "2024"
description = "Fast native dual-screen presenter for PDF slides"
authors = ["tschinz"]
license = "MIT"
repository = "https://github.com/tschinz/bella-presenter"
readme = "README.md"

[package.metadata.bundle]
name = "bella-presenter"
identifier = "ch.bellatola.bella-presenter"
icon = [
    "img/icon-32.png",
    "img/icon-64.png",
    "img/icon-128.png",
    "img/icon-256.png",
    "img/icon-512.png",
]
# Ship the platform's PDFium dynamic library inside the bundle. Populate this folder
# with `just setup-pdfium` before bundling.
resources = ["third_party/pdfium/lib"]
category = "Productivity"
short_description = "Dual-screen PDF presenter for Typst & LaTeX slides."
long_description = """
A fast, native dual-screen PDF presenter inspired by pympress. On the presenter
screen it shows the current slide, a next-slide preview, speaker notes, and a talk
timer; on the audience screen it shows just the slide, fullscreen.
"""

# Required for webcam access on macOS (without it the camera fails silently).
[package.metadata.bundle.osx]
info_plist_exts = ["bundle/info-ext.plist"]

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
display-info = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8.2.0"
nokhwa = { version = "0.10.11", features = ["input-native"] }
ort = "2.0.0-rc.13"

[profile.dev]
opt-level = 1          # keep debug builds snappy for PDF rendering

[profile.dev.package."*"]
opt-level = 3          # optimize deps (pdfium/image) even in dev

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
